name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Montar e compilar
        run: |
          bash notia_pacote/setup.sh
          cd notia
          flutter pub get
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: openexe-apk
          path: notia/build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp notia/build/app/outputs/flutter-apk/app-release.apk OpenEXE.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest OpenEXE.apk --title "OpenEXE (APK mais recente)" --notes "Baixe o OpenEXE.apk e instale no tablet." --target "$GITHUB_SHA"
